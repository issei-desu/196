<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リクレル数を見つけよう！</title>
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="style.css?v=11">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>リクレル数を見つけよう！</h1>
      <div class="user-name-group">
        <p class="name-note">ランキングに表示される名前だよ！本名は避けてね！</p>
        <input type="text" id="userNameInput" class="name-input" value="名無し" placeholder="名無し (任意)" aria-label="ニックネーム" maxlength="15" autocomplete="off">
      </div>
    </header>

    <section class="card input-section">
      <div class="input-row">
        <input type="text" id="initialInput" placeholder="自然数を入力..." value="196" autocomplete="off">
        <button id="resetBtn" class="btn btn-secondary">リセット</button>
      </div>

      <div class="controls-row">
        <div class="buttons-container">
          <div class="button-group">
            <button id="startStopBtn" class="btn btn-primary">開始</button>
            <button id="stepBtn" class="btn btn-outline">1ステップ</button>
          </div>
          <div id="pausedNotice" class="paused-notice" style="display: none;">
            あと<span id="pausedCountdownSec">60</span>秒で断念されるよ
          </div>
        </div>

        <div class="speed-control">
          <input type="range" id="speedRange" min="1" max="5" value="3">
          <span id="speedDisplay">普通 (100ms/step)</span>
        </div>
      </div>
    </section>

    <section class="card status-section">
      <div class="metrics">
        <div class="metric-item">
          <span class="metric-label">ステップ数</span>
          <span id="stepCount" class="metric-val">0</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">現在の桁数</span>
          <span id="digitCount" class="metric-val">3</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">判定</span>
          <span id="statusBadge" class="status-text status-idle">待機中</span>
        </div>
      </div>

      <details open class="calc-box">
        <summary class="calc-label">最新の計算</summary>
        <div id="currentCalcDisplay" class="calc-content">
          <span class="placeholder">数字を入力して「開始」を押してください</span>
        </div>
      </details>
    </section>

    <details open class="card history-section" id="historySection" style="display: none;">
      <summary class="history-header">
        <div class="history-title-wrap">
          <h2>計算履歴</h2>
          <span class="history-count">最新 <span id="historyCount">0</span> 件 (最大20件)</span>
        </div>
        <span class="history-toggle-hint"></span>
      </summary>
      <div class="history-list" id="historyList"></div>
    </details>

    <!-- 全端末共通のリクレル数ランキング -->
    <section class="card records-section">
      <div class="records-header">
        <div class="records-title-bar">
          <h2>挑戦ランキング</h2>
          <span class="live-indicator"><span class="live-dot"></span> LIVE</span>
        </div>
        <p class="records-desc">回文数になれてない数字の一覧だよ！<br>ステップ数でランキングにしたよ！</p>
      </div>

      <div class="table-wrapper">
        <table class="records-table">
          <thead>
            <tr>
              <th>順位</th>
              <th>開始数</th>
              <th>名前</th>
              <th>状態</th>
              <th>到達ステップ数</th>
              <th>到達桁数</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="rankingTableBody">
            <tr>
              <td colspan="7" style="text-align: center; padding: 16px; color: var(--text-sub);">ランキングを読み込み中...</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div id="emptyRankingMessage" class="empty-ranking-msg" style="display: none;">
        まだ記録がありません。数字を入力して探索を進めるとランキングに記録されます。
      </div>
    </section>
  </main>

  <script src="script.js?v=28"></script>
</body>
</html>
